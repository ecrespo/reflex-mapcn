[build-system]
requires = ["setuptools>=78.1.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reflex-mapcn"
version = "0.3.0"
description = "mapcn (MapLibre GL) map components for Reflex: maps, markers, popups, controls, routes, arcs, GeoJSON layers and clusters."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Ernesto Crespo", email = "ecrespo@gmail.com" }]
keywords = [
  "reflex",
  "reflex-custom-components",
  "mapcn",
  "maplibre",
  "map",
  "geojson",
  "markers",
]

# httpx already comes with reflex; it is declared because `helpers.py` imports
# it directly for the RainViewer frame index.
dependencies = ["reflex>=0.10.0", "httpx>=0.27"]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/ecrespo/reflex-mapcn"
Source = "https://github.com/ecrespo/reflex-mapcn"
Issues = "https://github.com/ecrespo/reflex-mapcn/issues"
"mapcn (upstream)" = "https://www.mapcn.dev"

[project.optional-dependencies]
# Pinned to a minor range so the Reflex stub generator regenerates byte-identical
# stubs in CI: the generator formats them with whatever ruff is installed.
dev = ["build>=1.2", "twine>=5", "ruff>=0.16,<0.17", "pytest>=8"]

[tool.setuptools.packages.find]
where = ["custom_components"]

[tool.setuptools.package-data]
reflex_mapcn = ["*.jsx", "*.css", "*.pyi", "py.typed"]

[tool.pytest.ini_options]
# The demo is an application, not a dependency of the package: put it on the
# path so its services can be tested without installing it.
pythonpath = [".", "mapcn_demo"]
testpaths = ["tests"]

[tool.bandit]
# Tests assert by design (B101) and build output is not ours to audit.
exclude_dirs = ["tests", ".venv", "mapcn_demo/.web", "mapcn_demo/.states"]

[tool.ruff]
line-length = 88
target-version = "py311"
# Ruff formats Python blocks inside markdown; documentation prose and its
# deliberately aligned sample comments are not the linter's to rewrite.
extend-exclude = ["*.md"]

[tool.ruff.format]
# Generated by Reflex's stub generator (`reflex_base.utils.pyi_generator`),
# which owns their layout.
exclude = ["*.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["A001", "A003"]

[tool.ruff.lint.per-file-ignores]
# Type stubs are generated by Reflex's stub generator; do not hand-wrap them.
"*.pyi" = ["E501"]
