name: Release

# Publishing is driven by a tag, and a tag only publishes if it points at a
# commit that is already on main and has passed the full CI gate.
#
# One-time setup on PyPI (no API token is stored in this repository):
#   https://pypi.org/manage/project/reflex-mapcn/settings/publishing/
#   Add a GitHub trusted publisher with
#     owner        ecrespo
#     repository   reflex-mapcn
#     workflow     release.yml
#     environment  pypi

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  guard:
    name: Verify the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Verify the tag matches the declared version
        env:
          TAG: ${{ github.ref_name }}
        run: uv run --no-project --with trove-classifiers python scripts/check_metadata.py --expect-version "$TAG"

      - name: Verify the tag points at a commit on main
        env:
          TAGGED_COMMIT: ${{ github.sha }}
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$TAGGED_COMMIT" origin/main; then
            echo "::error::$TAGGED_COMMIT is not on main. Merge to main before tagging a release."
            exit 1
          fi
          echo "Tagged commit is on main."

      - name: Verify this version is not already on PyPI
        run: |
          version="$(uv run --no-project --with tomli python -c '
          import pathlib, tomli
          print(tomli.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])
          ')"
          status="$(curl -sS -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/reflex-mapcn/${version}/json")"
          if [[ "$status" == "200" ]]; then
            echo "::error::reflex-mapcn ${version} is already on PyPI. Bump the version; PyPI never allows re-uploading one."
            exit 1
          fi
          echo "Version ${version} is free on PyPI (HTTP ${status})."

  validate:
    # The same gate that guards develop and main, re-run against the tagged
    # commit so nothing is published that has not passed it.
    name: CI
    needs: guard
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to PyPI
    needs: [guard, validate]
    runs-on: ubuntu-latest
    # Attach required reviewers to this environment to make releases manual.
    environment:
      name: pypi
      url: https://pypi.org/project/reflex-mapcn/
    permissions:
      # Trusted publishing: PyPI verifies this token instead of a stored secret.
      id-token: write
    steps:
      - name: Download the distributions built by CI
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  release-notes:
    name: Attach artifacts to the release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Create the release if it does not exist, then upload the artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber
